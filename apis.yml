- aid: adaptive-automation-technologies-mcp-server
  name: Adaptive MCP Server
  description: >-
    Adaptive ships a built-in Model Context Protocol server that lets AI agents — Claude,
    Cursor, VS Code and other MCP clients — work with an Adaptive workspace. Interactive
    clients connect to https://<workspace-url>/mcp over OAuth, registering themselves via
    RFC 7591 dynamic client registration and obtaining a token through a browser consent
    screen where the operator picks scopes, an optional Client App binding, and a token
    lifetime. Headless automation reaches the same server at /api/v3/client/mcp with a
    Client App's X-Client-ID and bearer client secret. Every tool call is authorized
    against the connecting user's own role and written to the activity log under that
    user's name.
  humanURL: https://documentation.adaptive.live/platform/organization/mcp-servers
  baseURL: https://app.adaptive.live
