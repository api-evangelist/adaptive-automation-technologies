aid: adaptive-automation-technologies
name: Adaptive Automation Technologies
description: >-
  Adaptive Automation Technologies, Inc. — trading as Adaptive (adaptive.live) — builds a
  privileged access management and data security platform that brokers credential-less,
  fully audited access to databases, Kubernetes clusters, virtual machines, cloud accounts,
  network appliances and internal web services for both human operators and autonomous AI
  agents. The platform is sold as three surfaces: Bastion/Stratos (just-in-time
  infrastructure and browser access with SSO and MFA), Exo (a secure agent harness with a
  tools/MCP registry, scoped networking and guardrails), and a shared trust layer covering
  authorization, audit, data masking, database activity monitoring, discovery and
  classification, and compliance reporting. Adaptive exposes a documented sixteen-operation
  REST Client API at /api/v3/client, a built-in remote MCP server secured by OAuth with
  RFC 7591 dynamic client registration, a cross-platform CLI, and first-party Terraform and
  Pulumi providers. It runs as managed cloud on app.adaptive.live or self-hosted on
  Kubernetes, Docker or an air-gapped VM.
