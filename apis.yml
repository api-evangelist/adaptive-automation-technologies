apis:
- aid: adaptive-automation-technologies-client-api
  name: Adaptive Client API
  description: >-
    The Adaptive Client API is a sixteen-operation REST API under /api/v3/client that
    exposes an Adaptive workspace to external systems: list users, resources, endpoints,
    authorizations, scripts and teams; fetch a database resource schema; manage membership
    of API-managed teams; stream the activity log as CSV for SIEM and compliance export;
    create and decide an access request in a single call from an external approval system
    such as Jira, Freshservice or ServiceNow; and pull the endpoint-and-user access report
    that powers access reviews. Requests authenticate with a Client App credential pair
    sent as an X-Client-ID header and an Authorization Bearer client secret, and a key can
    be restricted to any subset of ten operation scopes.
  humanURL: https://documentation.adaptive.live/developer-guide/adaptive-api
  baseURL: https://app.adaptive.live
