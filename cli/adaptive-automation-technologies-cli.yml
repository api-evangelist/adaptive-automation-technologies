contexts_and_profiles:
  supported: true
  detail: >-
    Kubernetes-style contexts let one CLI install address several Adaptive deployments.
  examples:
  - adaptive login --context-name staging --url https://staging.url.com
  - adaptive login --context-name production --url https://prod.url.com
  - adaptive connect --context-name staging staging.db-001
  - adaptive context
  - adaptive context use staging
  - adaptive context add dev https://dev.url.com
