description: >-
  `adaptive` is Adaptive's first-party cross-platform CLI and the primary way a human or a
  script actually USES the platform — it is a gateway that fronts each resource's own native
  client (psql, mongosh, kubectl, ssh, RDP, SFTP, S3) while Adaptive performs the
  authentication, authorization and session recording. It is a different surface from the
  Client API: the API administers the workspace, the CLI connects through it. Session history
  is preserved for later playback and audit.
name: adaptive
binary: adaptive
version_documented: v0.2.38
version_note: >-
  Read from the `adaptive version` output shown in the docs. The GitHub releases API for
  adaptive-scale/adaptivecli returns an empty list, so no dated release metadata is
  published; the install script is unpinned. See packages/.
install:
- method: script
  command: curl https://cli.adaptive.live/install.sh | bash
  platforms: [linux, macos]
  detail: >-
    Detects OS and CPU architecture automatically, including Apple Silicon under Rosetta, and
    appends `adaptive` to PATH by editing the correct shell startup file (.zshrc, .bashrc or
    .bash_profile).
  probed: true
  http_status: 200
- method: homebrew
  command: brew tap adaptive-scale/tap
  source: https://github.com/adaptive-scale/homebrew-tap
  detail: First-party Homebrew tap (also adaptive-scale/adaptivecli, "Brew tap for adaptive CLI").
authentication:
  command: adaptive login
  flow: >-
    Opens a browser login prompt and writes a token to ~/.adaptive/token. The token file is
    also read by the Terraform and Pulumi providers.
  logout: adaptive logout
