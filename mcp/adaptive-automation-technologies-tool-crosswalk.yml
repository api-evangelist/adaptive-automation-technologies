generated: '2026-09-07'
method: derived
source: >-
  https://documentation.adaptive.live/developer-guide/adaptive-api (the sixteen REST
  operations and the ten Client App scopes) crossed with
  https://documentation.adaptive.live/platform/organization/mcp-servers (the MCP consent
  scopes). No OpenAPI exists for this API, so bindings are keyed on documented HTTP
  method + path rather than on operationIds.
description: >-
  Adaptive's MCP server and its REST Client API are two projections of ONE authorization
  surface: the docs state that the same Client App Client ID and Client Secret authenticate
  both, that the MCP consent screen offers the same scope vocabulary as a restricted Client
  App key, and that binding an MCP token to a Client App intersects the two scope sets.
  That makes the crosswalk unusually tight — capability-for-capability — but it is a SCOPE
  crosswalk, not a tool crosswalk: the live tool names and inputSchemas are auth-gated
  (tools/list returned HTTP 401), so no tool name is invented below. Each row binds a
  documented MCP capability scope to the REST operation(s) that same scope authorizes.
surfaces:
  openapi:
    present: false
    note: >-
      Adaptive publishes no OpenAPI, Swagger, AsyncAPI, GraphQL SDL, .proto or WSDL on any
      host probed. The REST surface is documented in prose with curl examples only.
  rest:
    base_url: https://app.adaptive.live
    path_prefix: /api/v3/client
    docs: https://documentation.adaptive.live/developer-guide/adaptive-api
    gated: true
    note: All sixteen paths probed anonymously on 2026-09-07 and returned HTTP 401 JSON.
  graphql:
    present: false
  mcp:
    interactive_url: https://<workspace-url>/mcp
    headless_url: https://app.adaptive.live/api/v3/client/mcp
    docs: https://documentation.adaptive.live/platform/organization/mcp-servers
    gated: true
    note: tools/list returned HTTP 401; tool names and inputSchemas require an authenticated credential.
binding_basis: >-
  scope-to-operation, from the provider's own two scope tables. Confidence is `high` where
  the Client App scope table names the exact endpoints the scope allows, and `medium` where
  the MCP consent-screen wording is a paraphrase of that table.
