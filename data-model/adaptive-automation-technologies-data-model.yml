naming_inconsistency_note: >-
  Field casing is not uniform across the surface and a client must handle all three
  conventions: PascalCase (UserID, Email, TeamID, ActionName), lowerCamelCase (workspaceId,
  createdBy, resourceType, requestId) and snake_case (endpoint_id, user_email,
  session_count, table_name). Even the success envelope varies — Add Users to Team returns
  {"Status":"ok"} while Remove User from Team returns {"status":"ok"}. This is documented in
  the provider's own examples, not inferred.
