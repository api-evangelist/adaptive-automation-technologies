event_names_note: >-
  Drawn from documented examples (the activity-log actionNames filter and the release notes).
  Adaptive publishes no exhaustive event vocabulary, so this list is observed, NOT complete,
  and is not asserted to be the full set.
subscription_api: false
subscription_note: >-
  There is no API to register, list or delete a webhook subscription. Delivery destinations
  are configured in the console (Organization > default logger; Alerts > Channels) and none
  of the sixteen Client API operations touches them.
pull_alternative:
  operation: POST /api/v3/client/activity-log
  detail: >-
    The pull-based counterpart to the push surface — streams the same activity data as CSV,
    filtered by date range, resource, endpoint, session, action name and actor. For an
    integrator who cannot host a receiver, this is the supported path.
  docs: https://documentation.adaptive.live/developer-guide/adaptive-api
